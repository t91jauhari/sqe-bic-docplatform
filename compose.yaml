name: sqe-document-platform
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://sqe:${POSTGRES_PASSWORD}@postgres:5432/sqe
    STORAGE_DRIVER: minio
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    MINIO_BUCKET: sqe-documents
    MINIO_SECURE: "false"
    WORKFLOW_DRIVER: temporal
    TEMPORAL_ADDRESS: temporal:7233
  logging: *logging
  restart: unless-stopped
services:
  minio:
    build:
      context: ./docker/minio
    image: sqe-minio:2025-04-22
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
    restart: unless-stopped
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: sqe
      POSTGRES_USER: sqe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqe -d sqe"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped
  temporal:
    build:
      context: .
      dockerfile: infra/temporal.Dockerfile
    command: ["server","start-dev","--ip","0.0.0.0","--db-filename","/var/lib/temporal/development.db"]
    volumes:
      - temporal:/var/lib/temporal
    ports:
      - "127.0.0.1:8233:8233"
    healthcheck:
      test: ["CMD","temporal","operator","namespace","describe","--address","127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
    restart: unless-stopped
  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    <<: *backend
    command: ["python","-m","app.worker"]
    depends_on:
      api:
        condition: service_healthy
      temporal:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped
volumes:
  postgres:
  minio:
  temporal:
